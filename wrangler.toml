# Travel Memories — Cloudflare Worker configuration
#
# One Worker serves the static frontend (public/) and the API (/api/*).
# Three configurations:
#   (top level)        local development via `npm run dev` (R2 is simulated locally)
#   [env.staging]      deployed from the `develop` branch  -> travel-memories-staging
#   [env.production]   deployed from the `main` branch     -> travel-memories
#
# The top-level name must never equal the production name: a plain `wrangler deploy`
# (no --env) would otherwise overwrite production with development settings.
#
# Bindings and vars are NOT inherited by environments, so each env declares its own.
# Runtime secrets are never committed. Each environment needs:
#   ADMIN_PASSWORD_HASH   PBKDF2 hash of the admin password
#   SESSION_SECRET        random key signing session cookies
# Set both with `npm run setup:admin -- --env staging|production` (or .dev.vars locally).

name = "travel-memories-dev"
main = "src/index.js"
compatibility_date = "2026-10-15"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
# API routes and admin pages reach the Worker code first; everything else is served as static assets.
run_worker_first = ["/api/*", "/admin", "/admin/*"]

[observability]
enabled = true

[vars]
ADMIN_USERNAME = "dovene"
ADMIN_OWNER_ID = "dovene"
ENVIRONMENT = "development"
PUBLIC_USERNAME = "dovene"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "travel-memories-dev"

# Login attempts per IP (approximate, per Cloudflare location).
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# ---------------------------------------------------------------- staging
[env.staging]
name = "travel-memories-staging"

[env.staging.vars]
ADMIN_USERNAME = "dovene"
ADMIN_OWNER_ID = "dovene"
ENVIRONMENT = "staging"
PUBLIC_USERNAME = "dovene"

[[env.staging.r2_buckets]]
binding = "STORAGE"
bucket_name = "travel-memories-staging"

[[env.staging.ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# ------------------------------------------------------------- production
[env.production]
name = "travel-memories"

[env.production.vars]
ADMIN_USERNAME = "dovene"
ADMIN_OWNER_ID = "dovene"
ENVIRONMENT = "production"
PUBLIC_USERNAME = "dovene"

[[env.production.r2_buckets]]
binding = "STORAGE"
bucket_name = "travel-memories-production"

[[env.production.ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1003"
simple = { limit = 5, period = 60 }
