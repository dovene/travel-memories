<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Profile — Travel Memories admin</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#172D42" />
    <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/admin.css" />
  </head>
  <body class="admin admin-tool">
    <header class="admin-bar">
      <div class="inner">
        <div style="display: flex; align-items: center; gap: var(--space-2)">
          <a class="brand" href="/admin/">
            <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
              <circle cx="20" cy="20" r="19" fill="none" stroke="currentColor" stroke-width="1.4" />
              <circle cx="26" cy="14" r="3.6" fill="currentColor" />
              <path d="M7 28 15 18l5 6 4-4 9 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />
            </svg>
            <span class="brand-text">Travel Memories</span> <small>Studio</small>
          </a>
        </div>
        <nav class="admin-nav" aria-label="Admin sections">
          <a href="/admin/" data-icon="pin"><span>Destinations</span></a>
          <a href="/admin/visitors" data-icon="chart"><span>Visitors</span></a>
          <a href="/admin/backups" data-icon="archive"><span>Backups</span></a>
          <a href="/admin/profile" aria-current="page" data-icon="user"><span>Profile</span></a>
        </nav>
        <div class="actions">
          <a class="btn btn-sm hide-sm" id="view-live" href="../index.html" target="_blank" rel="noopener">View site</a>
          <a class="btn btn-sm" href="/admin/login" id="logout">Sign out</a>
          <span class="avatar" id="avatar" aria-hidden="true"></span>
        </div>
      </div>
    </header>

    <main class="admin-page" id="profile">
      <div class="editor-head">
        <div>
          <p class="crumbs">Studio / Profile</p>
          <h1>Profile</h1>
        </div>
      </div>

      <section class="panel profile-panel" aria-labelledby="name-title">
        <div class="panel-head">
          <div>
            <h2 id="name-title">Your name</h2>
            <p>Shown on the home page of your journal, above the title.</p>
          </div>
        </div>
        <form id="profile-form" novalidate>
          <div class="field" id="f-name">
            <label for="display-name">Name <span class="hint">1 to 80 characters</span></label>
            <input class="input" id="display-name" name="displayName" maxlength="80" autocomplete="name" required disabled />
            <p class="error" id="name-error"></p>
          </div>
          <p class="profile-preview" aria-live="polite">Preview: <span id="name-preview"></span></p>
          <div class="profile-actions">
            <button type="submit" class="btn btn-primary" id="profile-save" disabled>Save</button>
          </div>
        </form>
      </section>
    </main>

    <script src="../assets/js/icons.js"></script>
    <script src="../assets/js/i18n/en.js"></script>
    <script src="../assets/js/i18n.js"></script>
    <script src="../assets/js/gallery.js"></script>
    <script src="../assets/js/admin-shell.js"></script>
    <script src="../assets/js/admin-profile.js"></script>
  </body>
</html>
