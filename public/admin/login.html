<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sign in — Travel Memories</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#172D42" />
    <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="../assets/css/admin.css" />
  </head>
  <body class="admin">
    <main class="login">
      <section class="login-visual" aria-hidden="true">
        <img src="https://images.unsplash.com/photo-1570077188670-e3a8d69ac5ff?auto=format&fit=crop&q=78&w=1400&h=1400" alt="" />
        <a class="brand" href="../index.html" tabindex="-1">
          <svg class="brand-mark" viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="19" fill="none" stroke="currentColor" stroke-width="1.4" />
            <circle cx="26" cy="14" r="3.6" fill="currentColor" />
            <path d="M7 28 15 18l5 6 4-4 9 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />
          </svg>
          Travel Memories
        </a>
        <blockquote>
          Every place deserves to be remembered beautifully.
          <cite>Your travel journal studio</cite>
        </blockquote>
      </section>

      <section class="login-panel">
        <form class="login-card" id="login-form" novalidate>
          <div>
            <p class="eyebrow">Administration</p>
            <h1 style="margin-top: var(--space-3)">Welcome back</h1>
            <p class="sub">Sign in to manage your destinations and media.</p>
          </div>

          <div class="field" id="f-user">
            <label for="username">Username</label>
            <input class="input" id="username" name="username" autocomplete="username" required />
            <span class="error">Please enter your username.</span>
          </div>

          <div class="field" id="f-pass">
            <label for="password">Password</label>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required />
            <span class="error">Please enter your password.</span>
          </div>

          <p class="check">You stay signed in on this device for 7 days.</p>

          <button class="btn btn-primary btn-block" type="submit" id="login-btn">Sign in</button>

          <p class="form-error" id="login-error" role="alert" hidden></p>

          <a class="back-link" href="../index.html" style="color: var(--text-muted)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6" /></svg>
            Back to the journal
          </a>
        </form>
      </section>
    </main>

    <script>
      (function () {
        var form = document.getElementById("login-form");
        var btn = document.getElementById("login-btn");
        var errorBox = document.getElementById("login-error");

        function showError(text) {
          errorBox.textContent = text;
          errorBox.hidden = !text;
        }

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          showError("");
          var username = document.getElementById("username").value.trim();
          var password = document.getElementById("password").value;
          var ok = true;
          [["f-user", username], ["f-pass", password]].forEach(function (pair) {
            document.getElementById(pair[0]).classList.toggle("has-error", !pair[1]);
            if (!pair[1]) ok = false;
          });
          if (!ok) return;

          btn.classList.add("is-loading");
          btn.innerHTML = '<span class="spinner"></span> Signing in…';
          fetch("/api/admin/login", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: username, password: password })
          })
            .then(function (res) {
              if (res.ok) {
                location.replace("/admin/");
                return;
              }
              return res.json().catch(function () { return null; }).then(function (data) {
                var message = data && data.error && data.error.message;
                showError(message || "Sign-in failed. Please try again.");
                document.getElementById("password").select();
              });
            })
            .catch(function () {
              showError("Network error — check your connection.");
            })
            .then(function () {
              btn.classList.remove("is-loading");
              btn.textContent = "Sign in";
            });
        });
      })();
    </script>
  </body>
</html>
