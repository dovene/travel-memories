<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Travel Memories — Places, moments and memories</title>
    <meta name="description" content="A personal travel journal: places, moments and memories in photographs and videos." />
    <meta name="theme-color" content="#172D42" />
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/gallery.css" />
  </head>
  <body data-page="home">
    <a class="skip-link" href="#destinations" data-i18n="nav.skip">Skip to content</a>

    <header class="site-header">
      <div class="container">
        <a class="brand" href="index.html">
          <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="20" r="19" fill="none" stroke="currentColor" stroke-width="1.4" />
            <circle cx="26" cy="14" r="3.6" fill="currentColor" />
            <path d="M7 28 15 18l5 6 4-4 9 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />
          </svg>
          Travel Memories
        </a>
        <nav class="nav" aria-label="Main">
          <a class="nav-link" href="#destinations" data-i18n="nav.destinations">Destinations</a>
          <div class="lang-switch" role="group" data-i18n-attr="aria-label:nav.language">
            <button type="button" data-lang="en" aria-pressed="true">EN</button>
            <button type="button" data-lang="fr" aria-pressed="false">FR</button>
          </div>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero" id="top" aria-labelledby="hero-title">
        <div class="hero-slides"></div>
        <div class="hero-caption">
          <span class="hero-now-wrap"><span class="hero-now"><span data-i18n="hero.now">Now showing</span> — </span><a class="hero-place" data-hero-place href="#destinations"></a></span>
          <div class="hero-dots"></div>
        </div>
        <div class="container hero-content hero-enter">
          <p class="eyebrow" data-i18n="hero.eyebrow" data-author>A personal travel journal</p>
          <h1 class="hero-title" id="hero-title" data-i18n-html="hero.title">Places, moments <em>&amp; memories.</em></h1>
          <p class="hero-text" data-quote></p>
          <div class="hero-row">
            <div class="hero-actions">
              <a class="btn btn-light" href="#destinations">
                <span data-i18n="hero.cta">Explore my destinations</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" /></svg>
              </a>
              <button type="button" class="hero-play" data-hero-play hidden><span class="hero-play-orb" data-icon="play"></span><span class="hero-play-text" data-i18n="slideshow.play">Play</span></button>
            </div>
            <div class="hero-stats">
              <div class="hero-stat"><strong data-stat="places">–</strong><span data-i18n="hero.stat.places">Destinations</span></div>
              <div class="hero-stat"><strong data-stat="countries">–</strong><span data-i18n="hero.stat.countries">Countries</span></div>
              <div class="hero-stat"><strong data-stat="moments">–</strong><span data-i18n="hero.stat.moments">Moments</span></div>
            </div>
          </div>
        </div>
        <span class="scroll-cue" aria-hidden="true"></span>
      </section>

      <section class="section" id="destinations" aria-labelledby="dest-title">
        <div class="container">
          <div class="section-head">
            <div>
              <p class="eyebrow" data-i18n="places.eyebrow">The collection</p>
              <h2 class="section-title" id="dest-title" data-i18n="places.title">Destinations</h2>
            </div>
            <p class="lead" data-i18n="places.lead"></p>
          </div>

          <div class="toolbar">
            <div class="search" role="search">
              <label class="sr-only" for="search" data-i18n="search.label">Search destinations</label>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
              <input id="search" type="search" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:search.placeholder" />
              <button type="button" class="search-clear" hidden data-i18n-attr="aria-label:search.clear">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
              </button>
            </div>
            <div class="chips" id="country-chips" role="group" data-i18n-attr="aria-label:filters.label"></div>
            <p class="result-meta" id="result-meta" aria-live="polite"></p>
          </div>

          <div class="place-grid" id="place-grid"></div>

          <div class="empty" id="empty" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="m15.5 8.5-2 5-5 2 2-5z" /></svg>
            <h3 data-i18n="empty.title">No destination found</h3>
            <p></p>
            <button type="button" class="btn btn-primary" data-i18n="empty.reset">Reset filters</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="footer-bottom">
          <span data-year></span>
          <span><a href="admin/login.html" data-i18n="footer.admin">Administration</a> · <a href="#top" data-i18n="footer.top">Back to top</a></span>
        </div>
      </div>
    </footer>

    <script src="assets/js/icons.js"></script>
    <script src="assets/js/i18n/en.js"></script>
    <script src="assets/js/i18n/fr.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/filters.js"></script>
    <script src="assets/js/gallery.js"></script>
    <script src="assets/js/slideshow.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
